<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feladatmegoldások</title>

    <style>

        body{
            margin:0;
            padding:40px;
            background:#0f0f0f;
            color:white;
            font-family:Arial, sans-serif;
        }

        h1{
            text-align:center;
            margin-bottom:40px;
        }

        .container{
            max-width:800px;
            margin:auto;
        }

        .card{
            background:#1c1c1c;
            border-radius:12px;
            padding:25px;
            margin-bottom:25px;
            box-shadow:0 0 10px rgba(0,0,0,0.4);
        }

        .card h2{
            margin-top:0;
        }

        .download-btn{
            display:inline-block;
            margin-top:15px;
            padding:12px 22px;
            background:#4CAF50;
            color:white;
            text-decoration:none;
            border-radius:8px;
            transition:0.2s;
        }

        .download-btn:hover{
            background:#45a049;
            transform:scale(1.03);
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>Feladatmegoldások</h1>

        <div class="card">
            <h2>1. Mozi feladat</h2>

            <a class="download-btn"
               href="https://files.catbox.moe/9u4by1.zip">
                Letöltés
            </a>
        </div>

        <div class="card">
            <h2>2. Piac Büfé feladat</h2>

            <a class="download-btn"
               href="https://files.catbox.moe/03n8hh.zip">
                Letöltés
            </a>
        </div>

        <div class="card">
            <h2>3. Gyakorlás feladat1</h2>

            <a class="download-btn"
               href="https://files.catbox.moe/774o6b.zip">
                Letöltés
            </a>
        </div>

        <div class="card">
            <h2>4. Gyakorlás feladat2</h2>

            <a class="download-btn"
               href="https://files.catbox.moe/iehqbb.zip">
                Letöltés
            </a>
        </div>

    </div>

</body>
</html>
